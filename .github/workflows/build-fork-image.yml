# 为 fork 构建 WeKnora 镜像（本机带宽不足时的替代通道）
#
# 背景：本机到国内 apt 源的实测带宽只有 117-402 KB/s，app 镜像 runtime 阶段
# 要下载 250MB+ 依赖，本地 docker build 反复超时。GitHub Actions 的出口带宽
# 能稳定跑完，构建产物推 ghcr.io，本机再 pull 下来。
#
# 与上游 docker-image.yml 的区别（因此单独一个文件，避免与其冲突）：
#   - 只构 linux/amd64（本机就是 amd64，多架构纯属浪费时间）
#   - 推到 ghcr.io 而不是 Docker Hub（用内置 GITHUB_TOKEN，不需要额外 secrets）
#   - 用仓库里的原始 Dockerfile（CI 网络能直连 docker.io，无需镜像源改写）
#
# 产物：ghcr.io/<owner>/weknora-app:<sha7>  与  ghcr.io/<owner>/weknora-ui:<sha7>
# 注意：首次推送后 package 默认私有，若要让本机匿名 pull，需在 GitHub 的
#       Packages 页面把可见性改成 public；或者本地 docker login ghcr.io 用 PAT。
name: Build Fork Image

on:
  workflow_dispatch:
  push:
    branches:
      - main-synced

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive short sha
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.app
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/weknora-app:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/weknora-app:main-synced
          build-args: |
            WITH_ANYDOC=1
            COMMIT_ID_ARG=${{ github.sha }}
          cache-from: type=gha,scope=weknora-app
          cache-to: type=gha,scope=weknora-app,mode=max

  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive short sha
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/weknora-ui:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/weknora-ui:main-synced
          build-args: |
            VITE_FRONTEND_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=weknora-ui
          cache-to: type=gha,scope=weknora-ui,mode=max
