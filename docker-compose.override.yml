# 本地部署差异（生产实例）
#
# 为什么存在这个文件：
#   docker-compose.yml 在上游高频变更（近 80 次提交全部触及），本地若直接改它，
#   每次 `git merge upstream/main` 都会在部署配置上冲突。把所有本地差异挪到这里，
#   上游文件保持原样，工作树干净，合并永不冲突。
#
# 加载规则：docker compose 在**未显式指定 -f** 时自动合并本文件。
#   本机 scripts/start_all.sh 不传 -f，因此直接生效。
#   一旦某处调用显式写成 `-f docker-compose.yml`，本文件会被忽略 —— 那时需改成
#   COMPOSE_FILE=docker-compose.yml:docker-compose.override.yml 或去掉 -f。
#
# 与上游的差异共 5 处（逐条对应，新增差异请同步更新此注释）：
#   1. app 挂载 docker.sock      —— 启用 Docker 沙箱（等同宿主机 root，仅私有化单机）
#   2. app 挂载 builtin_models   —— 声明式内置模型（Embedding / Rerank）
#   3. neo4j 端口收紧到回环      —— 上游默认对外暴露 7474/7687
#   4. app 镜像走 ghcr 自建（digest 钉死） —— Docker Hub 的 latest 仍停在 v0.9.0，
#      该版本只实现 MinerU 4.0 Jobs API（POST /v1/uploads），而本地 MinerU 4.2.2
#      只提供 Tasks API（POST /v1/tasks），检测回落导致 404。v0.9.1 起才支持 Tasks
#      （upstream commit fd207aaa4）。上游 compose 默认 ${WEKNORA_VERSION:-latest}
#      且 .env 的 WEKNORA_VERSION 同时管 ui/docreader，故在此单点固定 app。
#   5. frontend 镜像走 ghcr 自建（digest 钉死） —— 前端含 4 处本地二开
#      （RuntimeTaskConsole 页 / RuntimeQueues tab / VITE_DEFAULT_GRAPH_ENABLED / i18n），
#      不能用官方 ui 镜像。
#   两个镜像均由 .github/workflows/build-fork-image.yml 在 dev 上构建并推
#   ghcr.io/leonye612/weknora-{app,ui}:<sha7>。本机 apt 带宽只有 117-402 KB/s，
#   本地构建 app 镜像必然超时，CI 是唯一稳定出包通道。
#   升级流程：push dev → 等 CI 绿 → 把下面两个 digest 换成新 sha 的 digest。

services:
  app:
    image: ghcr.io/leonye612/weknora-app@sha256:0bb0353bd0d275f1a19b44dfbac19818624713a2b45afbfa8f7254e5d3398826 # f1a9e9e
    build:
      # 只用于构建期：上游 Dockerfile.app 声明了 GOPROXY_ARG 但 compose 不传，
      # 空值会让 go mod download 走 proxy.golang.org（境外，实测极易卡住）。
      # args 在 override 中按 key 合并，不会覆盖上游已有的 APK_MIRROR_ARG 等。
      args:
        - GOPROXY_ARG=${GOPROXY_ARG:-https://goproxy.cn,direct}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/builtin_models.yaml:/app/config/builtin_models.yaml:ro

  neo4j:
    # ports 是列表，普通合并会「追加」成 4 条映射并导致端口冲突，
    # 必须用 !override 整体替换（Compose Spec 2.24+，本机 v5.0.2 支持）。
    ports: !override
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"

  frontend:
    image: ghcr.io/leonye612/weknora-ui@sha256:a33b6abc0177d037912234fc5eb30acb4944ebbf838ed64964f8dcaf4aab3805 # f1a9e9e
