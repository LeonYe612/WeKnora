# 为 fork 构建 WeKnora 镜像（本机带宽不足时的替代通道）
#
# 背景：本机到国内 apt 源的实测带宽只有 117-402 KB/s，app 镜像 runtime 阶段
# 要下载 250MB+ 依赖，本地 docker build 反复超时。GitHub Actions 的出口带宽
# 能稳定跑完，构建产物推 ghcr.io，本机再 pull 下来。
#
# 与上游 docker-image.yml 的区别（因此单独一个文件，避免与其冲突）：
#   - 只构 linux/amd64（本机就是 amd64，多架构纯属浪费时间）
#   - 推到 ghcr.io 而不是 Docker Hub（用内置 GITHUB_TOKEN，不需要额外 secrets）
#   - 用仓库里的原始 Dockerfile（CI 网络能直连 docker.io，无需镜像源改写）
#
# 产物：ghcr.io/<owner>/weknora-app:<sha7>  与  ghcr.io/<owner>/weknora-ui:<sha7>
#
# 认证说明（重要）：fork 仓库的 GITHUB_TOKEN **无法获得写权限**（GitHub 官方文档：
# 「可以使用 permissions 键添加和删除分叉存储库的读取权限，但通常不能授予其写入权限」），
# 所以必须用个人 PAT：
#   1. GitHub → Settings → Developer settings → Personal access tokens → Tokens (classic)
#      → Generate new token，勾选 write:packages（+ read:packages）
#   2. 本仓库 → Settings → Secrets and variables → Actions → New repository secret
#      名称 GHCR_TOKEN，值填该 PAT
# 下面的 password 写成 secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN：
# 配了 PAT 就用 PAT，没配时回退到内置 token（会失败，但错误信息更明确）。
name: Build Fork Image

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths-ignore:
      - '**.md'
      - 'deploy/**'
      - 'website-docs/**'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive short sha and lowercase owner
        id: meta
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # ghcr 要求仓库名全小写，而 github.repository_owner 保留原始大小写（如 LeonYe612）
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.app
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/weknora-app:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/weknora-app:dev
          build-args: |
            WITH_ANYDOC=1
            COMMIT_ID_ARG=${{ github.sha }}
          cache-from: type=gha,scope=weknora-app
          cache-to: type=gha,scope=weknora-app,mode=max

  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive short sha and lowercase owner
        id: meta
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # ghcr 要求仓库名全小写，而 github.repository_owner 保留原始大小写（如 LeonYe612）
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/weknora-ui:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/weknora-ui:dev
          build-args: |
            VITE_FRONTEND_COMMIT=${{ github.sha }}
            VITE_DEFAULT_GRAPH_ENABLED=true
          cache-from: type=gha,scope=weknora-ui
          cache-to: type=gha,scope=weknora-ui,mode=max
